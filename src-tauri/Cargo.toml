[package]
name = "recodeck"
version = "0.11.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "recodeck"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "recodeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
thiserror = "2"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
symphonia = { version = "0.5", features = ["all"] }
notify = "6.0"
reqwest = { version = "0.12", features = ["json"] }
lofty = "0.22"
walkdir = "2.5"
trash = "5.2.9"
unicode-normalization = "0.1"
sha2 = "0.10"
bliss-audio-aubio-rs = { version = "0.2", features = ["builtin", "bindgen"] }
rustfft = "6.2"
rayon = "1.10"

# Mobile companion server
axum = "0.8"
urlencoding = "2"
tower-http = { version = "0.6", features = ["cors", "fs"] }
local-ip-address = "0.6"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
# recodeck-eval only (feature "eval"): reads Traktor and Rekordbox collections.
roxmltree = { version = "0.21", optional = true }

# macOS: a batch the user started keeps its speed out of sight (src/user_activity.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

[dev-dependencies]
tempfile = "3.14"
# Router-level tests of the companion server (already in the tree through axum).
tower = { version = "0.5", features = ["util"] }

[features]
eval = ["dep:roxmltree"]

# Outside src/bin on purpose: the Tauri CLI bundles every file in src/bin,
# even a bin it skipped for its required features, and the Windows
# installer then fails on the missing exe.
[[bin]]
name = "recodeck-eval"
path = "tools/recodeck-eval.rs"
required-features = ["eval"]
